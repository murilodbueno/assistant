pagamento: Pix, dinheiro e cartao

labels:
  variantes: tipo de corte
  sujeito: nome do cliente

atendimento:
  saudacao: Posso informar precos, horarios ou agendar corte, escova e tratamentos.

horarios:
  ter: ["09:00-19:00"]
  qua: ["09:00-19:00"]
  qui: ["09:00-19:00"]
  sex: ["09:00-19:00"]
