services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    environment:
      WHATSAPP_HOOK_URL: https://${DOMAIN}/webhook/waha
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_HMAC_KEY}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
    volumes:
      - waha_data:/app/.sessions
    expose:
      - "3000"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
      - ./business:/app/business:ro
    expose:
      - "8000"
    depends_on:
      - waha

volumes:
  caddy_data:
  caddy_config:
  waha_data:
