[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petshop-assistant"
version = "0.1.0"
description = "Assistente de WhatsApp para pequenos negocios: atende, agenda servicos e envia lembretes"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.32",
    "google-auth>=2.30",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27"]

[project.scripts]
petshop-simulator = "petshop.simulator:main"
petshop-setup = "petshop.setup_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
