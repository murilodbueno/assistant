  - Chegar com 10 minutos de antecedencia.
  - Atrasos acima de 15 minutos podem precisar remarcar.

faq:
  - pergunta: Voces atendem sem horario marcado?
    resposta: Preferimos agendamento, mas aceitamos encaixe quando houver vaga.
